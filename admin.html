<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShebaNow - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .login-box { max-width: 350px; margin: 80px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .login-box h2 { text-align: center; color: #008060; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background: #008060; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .admin-dashboard { display: none; max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #008060; padding-bottom: 15px; }
        
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top; }
        .admin-table th { background-color: #008060; color: white; }
        
        .btn-setfee { background-color: #f0ad4e; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; font-weight: bold; display: block; width: 100%; }
        .btn-confirm { background-color: #0275d8; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; font-weight: bold; display: block; width: 100%; }
        .btn-complete { background-color: #5cb85c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; display: block; width: 100%; }
        .btn-change-pass { background-color: #f0ad4e; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-logout { background-color: #d9534f; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; margin-right: 4px; border: 1px solid #ccc; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 340px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; }
        .modal-content input, .modal-content select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="loginBox" class="login-box">
        <h2>অ্যাডমিন লগইন</h2>
        <form id="adminLoginForm">
            <input type="text" id="adminUser" placeholder="User Name" required>
            <input type="password" id="adminPass" placeholder="Password" required>
            <button type="submit">লগইন করুন</button>
        </form>
    </div>

    <div id="dashboard" class="admin-dashboard">
        <div class="header">
            <h2>ShebaNow - অ্যাডমিন ম্যানেজমেন্ট</h2>
            <div>
                <button class="btn-change-pass" id="openPassModalBtn">পাসওয়ার্ড পরিবর্তন</button>
                <button class="btn-logout" id="logoutAdminBtn">লগ-আউট</button>
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID & তারিখ</th>
                        <th>গ্রাহক ও মোবাইল</th>
                        <th>সেবা ও বিবরণ</th>
                        <th>ছবি</th>
                        <th>ঠিকানা</th>
                        <th>পেমেন্ট তথ্য</th>
                        <th>স্ট্যাটাস</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="adminOrderTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="passModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closePassModal">&times;</span>
            <h3 style="margin-top:0; color:#008060;">পাসওয়ার্ড পরিবর্তন</h3>
            <form id="changePassForm">
                <input type="password" id="currentPassInput" placeholder="বর্তমান পাসওয়ার্ড" required>
                <input type="password" id="newPassInput" placeholder="নতুন পাসওয়ার্ড" required>
                <button type="submit" style="width:100%; background:#008060; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer;">সেভ করুন</button>
            </form>
        </div>
    </div>

    <!-- Set Fee & Personal Number Modal -->
    <div id="setFeeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeSetFeeModal">&times;</span>
            <h3 style="margin-top:0; color:#008060;">বুকিং ফি ও পেমেন্ট নম্বর সেট করুন</h3>
            <form id="setFeeForm">
                <input type="hidden" id="feeFirebaseKey">
                
                <label style="font-size: 12px; font-weight: bold;">বুকিং ফি (টাকা):</label>
                <input type="number" id="customFeeInput" placeholder="যেমন: 150" required>

                <label style="font-size: 12px; font-weight: bold;">পার্সোনাল নম্বর (বিকাশ/নগদ/রকেট):</label>
                <input type="text" id="adminPaymentNumber" placeholder="যেমন: 01700000000" required>

                <button type="submit" style="width:100%; background:#f0ad4e; color:white; border:none; padding:10px; border-radius:4px; cursor:pointer; font-weight:bold;">ফি ও নম্বর পাঠান</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD96Zb90WfRKmssz3eA9veyJxgZlihC0UI",
            authDomain: "sheba-now-48771.firebaseapp.com",
            databaseURL: "https://sheba-now-48771-default-rtdb.firebaseio.com",
            projectId: "sheba-now-48771",
            storageBucket: "sheba-now-48771.firebasestorage.app",
            messagingSenderId: "365178191834",
            appId: "1:365178191834:web:2f8c8871b8ec7c206d8ae3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById("adminLoginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var user = document.getElementById("adminUser").value.trim();
            var pass = document.getElementById("adminPass").value.trim();
            var savedPass = localStorage.getItem("adminPassword") || "1234";

            if (user === "admin" && pass === savedPass) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
                renderAdminOrders();
            } else {
                alert("ভুল ইউজারনেম অথবা পাসওয়ার্ড!");
            }
        });

        document.getElementById("logoutAdminBtn").addEventListener("click", () => location.reload());

        var passModal = document.getElementById("passModal");
        document.getElementById("openPassModalBtn").addEventListener("click", () => passModal.style.display = "flex");
        document.getElementById("closePassModal").addEventListener("click", () => passModal.style.display = "none");

        var setFeeModal = document.getElementById("setFeeModal");
        document.getElementById("closeSetFeeModal").addEventListener("click", () => setFeeModal.style.display = "none");

        document.getElementById("changePassForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var currentPass = document.getElementById("currentPassInput").value.trim();
            var newPass = document.getElementById("newPassInput").value.trim();
            var activePassword = localStorage.getItem("adminPassword") || "1234";

            if (currentPass !== activePassword) {
                alert("বর্তমান পাসওয়ার্ডটি সঠিক নয়!");
                return;
            }
            localStorage.setItem("adminPassword", newPass);
            alert("পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!");
            passModal.style.display = "none";
            document.getElementById("changePassForm").reset();
        });

        function renderAdminOrders() {
            var tableBody = document.getElementById("adminOrderTableBody");
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 20px;">লোড হচ্ছে...</td></tr>';
            
            const bookingsRef = ref(db, 'bookings');
            get(bookingsRef).then((snapshot) => {
                tableBody.innerHTML = "";
                if (!snapshot.exists()) {
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 20px;">কোনো বুকিং পাওয়া যায়নি।</td></tr>';
                    return;
                }

                let ordersArray = [];
                snapshot.forEach((childSnapshot) => {
                    ordersArray.push({
                        firebaseKey: childSnapshot.key,
                        ...childSnapshot.val()
                    });
                });

                tableBody.innerHTML = ordersArray.reverse().map(function(o) {
                    let imgs = o.images && o.images.length > 0 
                        ? o.images.map(i => `<a href="${i}" target="_blank"><img src="${i}" class="img-thumb"></a>`).join('')
                        : 'নাই';

                    let payDetails = '<i style="color:#888;">ফি নির্ধারিত হয়নি</i>';
                    if (o.paymentInfo) {
                        payDetails = `<b style="color:#0275d8;">পেমেন্ট জমা হয়েছে!</b><br>নাম: ${o.paymentInfo.name}<br>নম্বর: ${o.paymentInfo.phone}<br>মাধ্যম: ${o.paymentInfo.method}<br>প্রেরক: ${o.paymentInfo.sender}<br><b>TrxID: ${o.paymentInfo.trxId}</b>`;
                    } else if (o.bookingFee) {
                        payDetails = `ফি: ৳${o.bookingFee}<br><small>নম্বর: ${o.paymentNumber}</small><br><b style="color:orange;">ইউজার পেমেন্টের অপেক্ষায়</b>`;
                    }

                    let statusText = o.status;
                    if (o.status === "Pending" && o.paymentInfo) {
                        statusText = "Pending (পেমেন্ট পর্যালোচনায়)";
                    } else if (o.status === "Confirmed") {
                        statusText = "Confirmed (টেকনিশিয়ানের অপেক্ষায়)";
                    } else if (o.status === "Completed") {
                        statusText = "Completed (সম্পন্ন)";
                    }

                    let actionButtons = "";
                    if (o.status === "Pending") {
                        if (!o.bookingFee) {
                            actionButtons = `<button class="btn-setfee" onclick="openSetFeeModal('${o.firebaseKey}')">ফি ও নম্বর সেট করুন</button>`;
                        } else if (o.paymentInfo) {
                            actionButtons = `<button class="btn-confirm" onclick="approvePayment('${o.firebaseKey}')">Approve & Confirm</button>`;
                        } else {
                            actionButtons = `<small style="color:gray;">গ্রাহক পেমেন্ট দেননি</small>`;
                        }
                    }

                    if (o.status === "Confirmed") {
                        actionButtons += `<button class="btn-complete" style="margin-top:4px;" onclick="updateOrderStatus('${o.firebaseKey}', 'Completed')">Mark Completed</button>`;
                    } else if (o.status === "Completed") {
                        actionButtons = `<span style="color:green; font-weight:bold;">সম্পন্ন হয়েছে</span>`;
                    }

                    return `
                        <tr>
                            <td><b>#${o.id}</b><br><small>${o.date}</small></td>
                            <td><b>${o.name}</b><br><a href="tel:${o.phone}">${o.phone}</a></td>
                            <td><b>${o.service}</b><br><small>${o.problem}</small></td>
                            <td>${imgs}</td>
                            <td><small>${o.address}</small></td>
                            <td>${payDetails}</td>
                            <td><b style="color:${o.status==='Completed'?'#5cb85c':(o.status==='Confirmed'?'#0275d8':'#f0ad4e')}">${statusText}</b></td>
                            <td>${actionButtons}</td>
                        </tr>
                    `;
                }).join("");
            }).catch((error) => {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:red; padding: 20px;">ডেটা লোড করতে সমস্যা হয়েছে: ${error.message}</td></tr>`;
            });
        }

        window.openSetFeeModal = function(firebaseKey) {
            document.getElementById("feeFirebaseKey").value = firebaseKey;
            document.getElementById("customFeeInput").value = "150";
            document.getElementById("adminPaymentNumber").value = "01700000000";
            setFeeModal.style.display = "flex";
        };

        // অ্যাডমিন ফি এবং পার্সোনাল নম্বর সাবমিট করলে ফায়ারবেসে আপডেট হবে
        document.getElementById("setFeeForm").addEventListener("submit", function(e) {
            e.preventDefault();
            var firebaseKey = document.getElementById("feeFirebaseKey").value;
            var customFee = document.getElementById("customFeeInput").value;
            var payNumber = document.getElementById("adminPaymentNumber").value;

            update(ref(db, 'bookings/' + firebaseKey), {
                bookingFee: customFee,
                paymentNumber: payNumber
            }).then(() => {
                alert("বুকিং ফি ও পেমেন্ট নম্বর সেট করা হয়েছে।");
                setFeeModal.style.display = "none";
                renderAdminOrders();
            });
        });

        // পেমেন্ট চেক করে এপ্রুভ ও কনফার্ম করা
        window.approvePayment = function(firebaseKey) {
            update(ref(db, 'bookings/' + firebaseKey), {
                status: "Confirmed"
            }).then(() => {
                alert("পেমেন্ট কনফার্ম করা হয়েছে!");
                renderAdminOrders();
            });
        };

        window.updateOrderStatus = function(firebaseKey, newStatus) {
            update(ref(db, 'bookings/' + firebaseKey), {
                status: newStatus
            }).then(() => {
                renderAdminOrders();
            });
        };
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">ShebaNow food delivery rider</title>
  <desc id="description">A detailed male ShebaNow rider in a green uniform, carrying a hot food parcel beside his insulated delivery bag.</desc>
  <defs>
    <linearGradient id="backdrop" x2="0" y2="1">
      <stop stop-color="#f6ebd6"/>
      <stop offset="1" stop-color="#fff9ec"/>
    </linearGradient>
    <linearGradient id="uniform" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#23b783"/>
      <stop offset=".55" stop-color="#0c966b"/>
      <stop offset="1" stop-color="#087254"/>
    </linearGradient>
    <linearGradient id="thermalBag" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fa8050"/>
      <stop offset="1" stop-color="#cf482f"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efbd96"/>
      <stop offset="1" stop-color="#cc8965"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20a878"/>
      <stop offset="1" stop-color="#075e49"/>
    </linearGradient>
  </defs>

